services:
  # FastAPI Backend Service — Docker build so ffmpeg (required by pydub and
  # for chunking uploaded video/audio) is guaranteed to be present.
  - type: web
    name: video-summarizer-with-rag-backend1
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: CHROMA_API_KEY
        sync: false
      - key: CHROMA_TENANT
        value: 52fb452f-1e38-40f1-a701-d99c7dd5eecc
      - key: CHROMA_DATABASE
        value: RAG
      - key: MISTRAL_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: MISTRAL_MODEL
        value: mistral-small-latest
      - key: WHISPER_MODEL
        value: base
      - key: DISABLE_OLLAMA
        value: "true"

  # React + Vite Frontend Static Site
  - type: web
    name: video-summarizer-with-rag
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      # Baked into the bundle at build time. frontend/.env.production carries the
      # same value so a plain `vite build` also works; the app additionally
      # falls back to the *.onrender.com backend at runtime if neither is set.
      - key: VITE_API_URL
        value: https://video-summarizer-with-rag-backend1.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
