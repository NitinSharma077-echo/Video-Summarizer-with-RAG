services:
  # FastAPI Backend Service — Docker build so ffmpeg (required by pydub and
  # for chunking uploaded video/audio) is guaranteed to be present. Whisper
  # and the embedding model are baked into the image at build time.
  - type: web
    name: video-summarizer-backend
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: MISTRAL_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: MISTRAL_MODEL
        value: mistral-small-latest
      - key: WHISPER_MODEL
        value: base
      - key: DISABLE_OLLAMA
        value: "true"

  # React + Vite Frontend Static Site
  # IMPORTANT: Vite bakes VITE_* vars in at build time. After the backend's
  # first deploy, copy its actual onrender.com URL from the Render dashboard
  # (it may get a random suffix if the exact name is taken) and update the
  # value below, then redeploy the frontend so the build picks it up. The
  # frontend calls `${VITE_API_URL}/upload`, `/process`, `/chat`, etc.
  - type: web
    name: video-summarizer-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: VITE_API_URL
        value: https://video-summarizer-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
