services:
  # FastAPI Backend Service — Docker build so ffmpeg (required by pydub and
  # for chunking uploaded video/audio) is guaranteed to be present.
  - type: web
    name: video-summarizer-backend
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: CHROMA_API_KEY
        sync: false
      - key: CHROMA_TENANT
        value: 52fb452f-1e38-40f1-a701-d99c7dd5eecc
      - key: CHROMA_DATABASE
        value: RAG
      - key: MISTRAL_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: MISTRAL_MODEL
        value: mistral-small-latest
      - key: WHISPER_MODEL
        value: base
      - key: DISABLE_OLLAMA
        value: "true"

  # React + Vite Frontend Static Site
  # IMPORTANT: Vite bakes VITE_* vars in at build time. After the backend's
  # first deploy, copy its actual onrender.com URL from the Render dashboard
  # and set VITE_API_URL, then redeploy the frontend.
  - type: web
    name: video-summarizer-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: VITE_API_URL
        value: https://video-summarizer-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
